# Optional reverse proxy that presents the whole app on a single origin.
# This keeps CSP connect-src 'self' valid: the SPA and API share an origin.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  upstream studio_api { server studio-os-api:3000; }
  upstream studio_web { server studio-os-web:80; }

  server {
    listen 80;
    server_name _;

    # Long-lived SSE for the AI chat stream.
    location /api/ai/chat {
      proxy_pass http://studio_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      proxy_pass http://studio_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
      proxy_pass http://studio_api;
    }

    location / {
      proxy_pass http://studio_web;
      proxy_set_header Host $host;
    }
  }
}
